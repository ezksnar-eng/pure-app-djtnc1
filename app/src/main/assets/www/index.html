<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>Image → 3D (مجاني)</title>
<style>
:root{--bg:#09090b;--card:#18181b;--line:#27272a;--tx:#f4f4f5;--mut:#71717a;--ac:#8b5cf6;--ok:#10b981}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);overscroll-behavior:none;font-family:"Segoe UI",Tahoma,sans-serif}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:21px}h1 span{color:#a78bfa}
small,.mut{color:var(--mut);font-size:12px}
.hidden{display:none!important}
.drop{display:grid;place-items:center;text-align:center;min-height:160px;border:2px dashed #3f3f46;background:var(--card);border-radius:18px;color:#a1a1aa;cursor:pointer;overflow:hidden}
.drop input{display:none}.drop .t{padding:24px;line-height:1.9}
.drop img{max-height:260px;max-width:100%;display:block}
details{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
summary{cursor:pointer;font-size:14px;color:#d4d4d8;list-style:none}summary::-webkit-details-marker{display:none}
.set{margin-top:12px;display:flex;flex-direction:column;gap:12px;font-size:14px}
.set label{display:flex;gap:8px;align-items:center}
.set .l{color:#a1a1aa;margin-bottom:4px}
.set input[type=text],.set input[type=password]{width:100%;background:#09090b;border:1px solid var(--line);border-radius:10px;padding:9px;color:var(--tx);direction:ltr;font:inherit}
.set input[type=range]{width:100%}.set input{accent-color:var(--ac)}
.rv{display:flex;justify-content:space-between;color:#a1a1aa}
.btn{width:100%;border:0;border-radius:18px;padding:16px;font:inherit;font-size:18px;font-weight:800;color:#09090b;cursor:pointer}
.btn:active{transform:scale(.99)}.btn:disabled{opacity:.45}
#go{background:var(--ac)}#dl{background:var(--ok)}
.status{border:1px solid var(--line);background:var(--card);color:#d4d4d8;border-radius:12px;padding:12px;font-size:14px;line-height:1.7;word-break:break-word}
.status.err{background:#450a0a99;border-color:#7f1d1d;color:#fecaca}
.viewer{position:relative;height:55vh;min-height:320px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:linear-gradient(#27272a,#09090b)}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hint{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);font-size:14px;pointer-events:none;text-align:center;padding:12px}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Image → 3D <span>مجاني</span></h1><small>TripoSR · Hugging Face</small></header>

  <label class="drop" id="drop">
    <input id="file" type="file" accept="image/*">
    <span id="dropTxt" class="t">📷 اضغط لاختيار صورة من جوالك<br><small>الأفضل: جسم واحد واضح وخلفية بسيطة</small></span>
    <img id="prev" class="hidden" alt="">
  </label>

  <details>
    <summary>⚙️ إعدادات</summary>
    <div class="set">
      <label><input id="rmbg" type="checkbox" checked> إزالة الخلفية تلقائياً</label>
      <div><div class="rv"><span>دقة المجسم</span><b id="resV">256</b></div><input id="res" type="range" min="128" max="320" step="32" value="256"></div>
      <div><div class="l">Space (اتركه كما هو أو حط نسختك المكررة)</div><input id="space" type="text" value="stabilityai/TripoSR"></div>
      <div><div class="l">HF Token (اختياري — حصة أكبر)</div><input id="tok" type="password" placeholder="hf_..."></div>
    </div>
  </details>

  <button id="go" class="btn">ولّد المجسم 3D</button>
  <div id="status" class="status hidden"></div>

  <div class="viewer"><canvas id="cv"></canvas><div id="hint">المعاينة تظهر هنا — دوّر بإصبعك، قرّب بإصبعين</div></div>

  <button id="dl" class="btn" disabled>⬇️ Download .glb</button>
  <small style="line-height:1.8">مجاني عبر Spaces على Hugging Face، فقد يوجد طابور أو حد استخدام. إذا طلع خطأ جرّب بعد دقائق أو ضع HF Token.</small>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
const $ = id => document.getElementById(id);
const store = { get(k){try{return localStorage.getItem(k)||""}catch(e){return""}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };
$("tok").value = store.get("hf_tok"); $("tok").oninput = e => store.set("hf_tok", e.target.value.trim());
$("res").oninput = e => $("resV").textContent = e.target.value;
const say = (t, err) => { const s=$("status"); s.textContent=t||""; s.className = "status" + (err ? " err" : "") + (t ? "" : " hidden"); };

/* ---------- Three.js viewer ---------- */
const cv = $("cv"), R = new THREE.WebGLRenderer({canvas:cv, antialias:true, alpha:true, preserveDrawingBuffer:false});
R.setPixelRatio(Math.min(devicePixelRatio,2)); R.outputEncoding = THREE.sRGBEncoding;
const S = new THREE.Scene(), cam = new THREE.PerspectiveCamera(40,1,.01,100); cam.position.set(0,.6,3.4);
const ctl = new THREE.OrbitControls(cam, cv); ctl.enableDamping = true; ctl.autoRotate = true; ctl.autoRotateSpeed = 2;
S.add(new THREE.HemisphereLight(0xffffff,0x444455,1.1));
const d1 = new THREE.DirectionalLight(0xffffff,.9); d1.position.set(3,5,4); S.add(d1);
const d2 = new THREE.DirectionalLight(0xaab4ff,.5); d2.position.set(-4,2,-3); S.add(d2);
let cur = null;
function fit(){ const r = cv.parentElement.getBoundingClientRect(); R.setSize(r.width, r.height, false); cam.aspect = r.width/r.height; cam.updateProjectionMatrix(); }
addEventListener("resize", fit); fit();
(function loop(){ requestAnimationFrame(loop); ctl.update(); R.render(S,cam); })();
function showModel(root){
  if (cur){ S.remove(cur); cur.traverse(o=>{ if(o.isMesh){ o.geometry.dispose(); [].concat(o.material).forEach(m=>m.dispose()); } }); }
  const b = new THREE.Box3().setFromObject(root), sz = b.getSize(new THREE.Vector3()), c = b.getCenter(new THREE.Vector3());
  const k = 2 / Math.max(sz.x, sz.y, sz.z, 1e-4);
  root.scale.multiplyScalar(k); root.position.sub(c.multiplyScalar(k));
  root.traverse(o=>{ if(o.isMesh){ o.material.side = THREE.DoubleSide; } });
  S.add(root); cur = root; ctl.target.set(0,0,0); $("hint").classList.add("hidden");
}

/* ---------- Image input ---------- */
let imgBlob = null;
$("file").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const i = new Image();
  i.onload = () => {
    const k = Math.min(1, 1024/Math.max(i.width,i.height)), c = document.createElement("canvas");
    c.width = Math.round(i.width*k); c.height = Math.round(i.height*k);
    c.getContext("2d").drawImage(i,0,0,c.width,c.height);
    c.toBlob(b => { imgBlob = b; $("prev").src = URL.createObjectURL(b); $("prev").classList.remove("hidden"); $("dropTxt").classList.add("hidden"); }, "image/png");
    URL.revokeObjectURL(i.src);
  };
  i.src = URL.createObjectURL(f);
};

/* ---------- Gradio client (loaded on demand, tries several versions) ---------- */
let gc = null;
async function loadGradio(){
  if (gc) return gc; let last;
  for (const v of ["1.15.1","1.8.0","1.7.0"]) {
    try { gc = await import(`https://cdn.jsdelivr.net/npm/@gradio/client@${v}/dist/index.min.js`); if (gc.Client && gc.handle_file) return gc; } catch(e){ last = e; }
  }
  throw new Error("تعذّر تحميل مكتبة Gradio — تأكد من الإنترنت. " + (last && last.message || ""));
}
const errText = e => (e && (e.message || e.detail)) || (typeof e === "string" ? e : JSON.stringify(e));

async function call(app, name, args){
  let out;
  for await (const m of app.submit(name, args)) {
    if (m.type === "status") {
      if (m.stage === "error") throw new Error(m.message || "خطأ من السيرفر (ممكن الحصة خلصت أو الـ Space متوقف)");
      if (m.position != null) say(`بالطابور… دورك ${m.position + 1}${m.size ? " من " + m.size : ""}`);
      else if (m.stage === "generating") say("جاري المعالجة على السيرفر…");
    } else if (m.type === "data") out = m;
  }
  if (!out) throw new Error("ما رجع رد من السيرفر");
  return out.data;
}

let glbBlob = null;
$("go").onclick = async () => {
  if (!imgBlob) return say("اختر صورة أول.", true);
  const btn = $("go"); btn.disabled = true; $("dl").disabled = true; glbBlob = null;
  try {
    say("جاري الاتصال بالسيرفر المجاني…");
    const { Client, handle_file } = await loadGradio();
    const tok = $("tok").value.trim();
    const app = await Client.connect($("space").value.trim() || "stabilityai/TripoSR", tok ? { hf_token: tok } : {});
    say("تجهيز الصورة وإزالة الخلفية…");
    const pre = await call(app, "/preprocess", [handle_file(imgBlob), $("rmbg").checked, 0.85]);
    say("توليد المجسم 3D… (قد ياخذ دقيقة)");
    const gen = await call(app, "/generate", [pre[0], +$("res").value]);
    const files = gen.flat().filter(x => x && (x.url || x.path));
    const f = files.find(x => /\.glb(\?|$)/i.test(x.url || x.path)) || files[files.length-1];
    if (!f) throw new Error("ما رجع ملف مجسم");
    say("تحميل المجسم…");
    const buf = await (await fetch(f.url || f.path)).arrayBuffer();
    glbBlob = new Blob([buf], { type: "model/gltf-binary" });
    const g = await new Promise((ok,no) => new THREE.GLTFLoader().parse(buf, "", ok, no));
    showModel(g.scene); $("dl").disabled = false; say("تم ✔ — دوّر المجسم ونزّله");
  } catch (e) {
    say("فشل: " + errText(e), true);
  }
  btn.disabled = false;
};

/* ---------- Direct download ---------- */
$("dl").onclick = () => {
  if (!glbBlob) return;
  const a = document.createElement("a"); a.href = URL.createObjectURL(glbBlob); a.download = "model-" + Date.now() + ".glb";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 10000);
};
</script>
</body>
</html>
