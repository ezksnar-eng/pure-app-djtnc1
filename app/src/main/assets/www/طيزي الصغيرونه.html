<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Studio</title>
    <!-- استدعاء مكتبة Three.js ومحمل ملفات OBJ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background-color: #12161a; color: #fff; padding: 15px; }
        .header { text-align: center; margin-bottom: 20px; color: #4db8ff; }
        .container { display: flex; flex-direction: column; gap: 15px; max-width: 800px; margin: 0 auto; }
        .panel { background: #1a2129; border: 1px solid #2a3545; border-radius: 10px; padding: 15px; }
        #canvas-container { width: 100%; height: 350px; background: #0d1117; border-radius: 8px; position: relative; overflow: hidden; }
        .btn { background: #0088cc; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; }
        .btn:hover { background: #00aaff; }
        input[type="file"] { display: none; }
        .file-label { display: block; background: #253342; text-align: center; padding: 12px; border-radius: 6px; border: 1px dashed #4db8ff; cursor: pointer; }
        .controls { display: flex; gap: 10px; margin-top: 10px; }
    </style>
</head>
<body>

    <h2 class="header">استعراض وتعديل مجسمات 3D</h2>

    <div class="container">
        <!-- منطقة العرض الـ 3D -->
        <div class="panel">
            <h3>مشاهد ثلاثي الأبعاد</h3>
            <div id="canvas-container"></div>
            <div class="controls">
                <button class="btn" onclick="resetCamera()">إعادة ضبط الكاميرا</button>
            </div>
        </div>

        <!-- لوحة رفع الملفات -->
        <div class="panel">
            <h3>تحميل مجسم (.OBJ)</h3>
            <p style="font-size: 13px; color: #aaa; margin-bottom: 10px;">اختر ملف مجسم بصيغة .obj من جهازك للعارض:</p>
            <label class="file-label" for="obj-file">📁 اختر ملف OBJ</label>
            <input type="file" id="obj-file" accept=".obj">
        </div>
    </div>

    <script>
        // إعداد مشهد Three.js
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0d1117);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 1, 3);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        // إضاءة المشهد
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(5, 10, 7.5);
        scene.add(dirLight);

        // تحكم الكاميرا باللمس / الماوس
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        let currentModel = null;

        // قراءة وتكبير/تصغير الملف عند الرفع
        document.getElementById('obj-file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const contents = event.target.result;
                const loader = new THREE.OBJLoader();
                
                if (currentModel) scene.remove(currentModel);

                currentModel = loader.parse(contents);
                
                // تطبيق مادة خامة افتراضية
                currentModel.traverse((child) => {
                    if (child.isMesh) {
                        child.material = new THREE.MeshStandardMaterial({ color: 0xc85555, roughness: 0.4 });
                    }
                });

                scene.add(currentModel);
                resetCamera();
            };
            reader.readAsText(file);
        });

        function resetCamera() {
            camera.position.set(0, 1, 3);
            controls.target.set(0, 0, 0);
            controls.update();
        }

        // حلقة التحديث والرندر
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // تجاوب الشاشة
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>
</html>
